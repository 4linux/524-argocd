apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: estudo
  namespace: argocd
  finalizers:
    # Ao remover a Application, remove também os objetos que ela criou
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://192.168.88.10:3000/524/estudo-argocd.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: estudo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
