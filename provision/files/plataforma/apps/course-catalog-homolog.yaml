apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: course-catalog-homolog
  namespace: argocd
  finalizers:
    # Ao remover a Application, remove também os objetos que ela criou
    - resources-finalizer.argocd.argoproj.io
spec:
  project: curso
  source:
    repoURL: http://192.168.88.10:3000/524/course-catalog-deploy.git
    targetRevision: main
    path: overlays/homolog
  destination:
    server: https://kubernetes.default.svc
    namespace: homolog
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
