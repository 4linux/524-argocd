apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarqube
  namespace: argocd
spec:
  project: default
  sources:
    # O chart oficial, na mesma versão instalada com o helm install
    - repoURL: https://SonarSource.github.io/helm-chart-sonarqube
      chart: sonarqube
      targetRevision: 2026.5.1002
      helm:
        releaseName: sonarqube
        valueFiles:
          - $values/sonarqube/values.yaml
    # O repositório plataforma, de onde vêm os valores
    - repoURL: http://192.168.88.10:3000/524/plataforma.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sonarqube
